<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your Stay (TEST)</title><meta name="robots" content="noindex">
<style>
:root{--bg:#fff;--ink:#16181d;--muted:#6b7079;--line:#ececec;--soft:#f4f4f5;--brand:#020051;--accent:#FFB600;--ok:#1f8a4c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#eef0f2;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px}
.hero{height:300px;background:linear-gradient(160deg,#020051,#14127a 65%,#3a2f6b);background-size:cover;background-position:center;position:relative;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.45))}
.hero .t{position:absolute;left:24px;right:24px;bottom:56px;z-index:1}.hero .hey{font-size:15px;opacity:.9}.hero h1{margin:4px 0 0;font-size:25px;line-height:1.2;font-weight:700}
.sheetwrap{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-34px;position:relative;z-index:2;padding:26px 22px 10px}
h2{font-size:24px;line-height:1.25;margin:0 0 14px}h3{font-size:20px;margin:26px 0 10px}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;cursor:pointer;border:0;background:none;width:100%;text-align:left;font:inherit;color:inherit}
.row .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:26px;flex:0 0 44px;background:var(--soft)}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;font-weight:600}.row .tx span{display:block;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ch{color:#b5b8be;font-size:22px}.lockbadge{color:var(--accent)!important}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 4px}.tile{background:var(--soft);border-radius:16px;padding:14px 16px}.tile span{display:block;color:var(--muted);font-size:14px}.tile b{font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.chip{border:1px solid #d9dbe0;background:#fff;border-radius:999px;padding:8px 16px;font:inherit;font-size:15px;white-space:nowrap;cursor:pointer;color:var(--ink)}.chip.on{background:#020051;color:#fff;border-color:#020051}
.cards{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.card{flex:0 0 72%;scroll-snap-align:start;cursor:pointer;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.card .im{height:170px;border-radius:18px;background:#ddd center/cover;position:relative}.card .tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);border-radius:999px;padding:3px 10px;font-size:13px}
.card b{display:block;margin:10px 4px 0;font-weight:600}.card span{display:block;margin:2px 4px;color:var(--muted)}
.big{width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;margin-bottom:18px}.big .im{height:180px;border-radius:18px;background:#ccc center/cover}.big b{display:block;margin:10px 4px 0}.big span{display:block;margin:2px 4px;color:var(--muted);font-size:15px}
.done{display:flex;align-items:center;gap:12px;background:#f0faf4;border-radius:14px;padding:12px 14px;margin:8px 0}.done b{flex:1}.done em{font-style:normal;color:var(--ok);font-weight:600;font-size:14px}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
nav.tabs button{border:0;background:none;font:inherit;font-size:14px;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}nav.tabs button.on{background:#ebebec}nav.tabs i{font-style:normal;font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}.ov[hidden]{display:none}
.pane{background:#fff;width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 22px 34px}
.pane .x{float:right;border:0;background:var(--soft);border-radius:999px;width:34px;height:34px;font-size:18px;cursor:pointer}
.pane h3{margin:4px 0 12px}.pane h4{margin:16px 0 4px}.pane ul,.pane ol{padding-left:22px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:#020051;color:#fff;font:inherit;font-weight:600;padding:15px;margin-top:14px;cursor:pointer;text-align:center;text-decoration:none}.btn.alt{background:var(--soft);color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #e2e4e8;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}.opt.on{border-color:#16181d;background:#fafafa}.opt small{display:block;color:var(--muted)}
.hl{list-style:none;padding:0}.hl li::before{content:"✓ ";color:var(--ok)}
.lockbox{background:#fff8ec;border:1.5px dashed var(--accent);border-radius:16px;padding:16px;text-align:center}.code{font-size:30px;font-weight:700;letter-spacing:.08em}
label{display:block;font-weight:600;margin:14px 0 6px}label small{font-weight:400;color:var(--muted)}input,select,textarea{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #dfe1e6;border-radius:12px;background:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}.check input{width:22px;height:22px;flex:0 0 22px}
.steps{display:flex;gap:6px;margin:6px 0 18px}.steps i{flex:1;height:5px;border-radius:9px;background:#e5e7eb}.steps i.on{background:#FFB600}
.agree{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;background:#fafafa}
canvas{width:100%;height:150px;border:1.5px dashed #c9ccd3;border-radius:12px;background:#fff;touch-action:none}
.err{color:#c62828;font-size:14px;margin-top:8px}
.test{margin:20px 22px 0;border:1px dashed #c9ccd3;border-radius:14px;padding:12px 14px;font-size:14px;background:#fafbfc}.test b{display:block;margin-bottom:6px}.test .chips{padding:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#16181d;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;font-size:15px;max-width:90%}.toast[hidden]{display:none}
.cover{min-height:100vh;padding:48px 24px 30px;text-align:center;background:#020051;color:#fff}.cover .logo{width:78%;max-width:320px;margin:0 auto 34px;display:block}.cover h1{color:#fff}.cover .sub{color:#c9c8e6}.cover .cbox{color:var(--ink)}.cover .btn{background:#FFB600;color:#020051}.cover>.cs{color:#c9c8e6!important}.cw{color:#FFB600;letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:600}.cover h1{font-size:34px;margin:6px 0 6px}.sub{color:var(--muted);margin:0 0 24px}.cbox{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-align:left;box-shadow:0 4px 18px rgba(0,0,0,.05)}.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.cl{color:var(--muted);font-size:13px}.cv{font-weight:600;font-size:17px}.cs{color:var(--muted);font-size:13px}
.vsteps{display:flex;flex-direction:column;gap:14px;margin:8px 0 14px}.vsteps figure{margin:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fafafa}.vsteps img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eee}.vsteps figcaption{padding:12px 14px}
.incode{margin-top:10px;background:#FFB600;color:#020051;border-radius:10px;padding:10px 12px;font-size:16px}.incode.lockedc{background:#fff8e6;color:#6b5200;font-size:14px}
.tipbox{background:#f3f4fb;border-radius:14px;padding:12px 14px;margin:10px 0}.tipbox p{margin:0 0 6px}.tipbox p:last-child{margin:0}.warnbox{background:#fff4e5}
.viator{border-radius:18px;padding:18px;background:linear-gradient(135deg,#0b3d2e,#186a52);color:#fff;margin-bottom:14px}
</style></head><body>
<div class="app" id="app"></div>
<div class="ov" id="ov" hidden><div class="pane" id="pane"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const D={"booking": {"first": "Shelley", "last": "T.", "res": "TEST-001", "ci": "2026-11-12", "co": "2026-11-15", "ciTime": "3:00 PM", "coTime": "10:00 AM", "guests": 2}, "prop": {"keysteps": [{"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/1b9f6298-3b98-49fb-8a46-b42fbffbd1f2.png", "cap": "1. Drive along Irving Street. Park near 11 Irving Street, where the arrow shows."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/4524fffb-4279-4a55-88b8-bf3112409245.png", "cap": "2. Walk along the footpath towards the trees. You will see this pay metre located across the road from &#x27;Oaks Canopy sign&#x27;"}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/81d45f7b-2074-436a-a1d1-2f93da0e3d42.png", "cap": "3. The lockbox is chained to the base of this tree, next to the street sign and parking meter."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/8b0398b4-11c6-41bd-9139-87b1b9a0b056.jpg", "cap": "4. Enter the code shown in your Stay details to open the lockbox."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/ced59628-ad51-4ad2-9a9a-af1b0cc0eb49.jpg", "cap": "5. Take ALL 3 keys: the black button remote (garage doors), the fob (lifts and building) and the Unit 8 door key. Close the box and scramble the code."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/99556b79-e1c1-420a-a74c-39de35baf75d.jpg", "cap": "6. No car? Head into the building. In the lift, tap your fob on the reader and press Level 2."}], "keyvideo": "", "parksteps": [{"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/9aaff460-d787-453d-a323-ee0fd3806c04.jpg", "cap": "1. The car park entry is at 9 Irving Street, on the left side of the gym. Use the black remote to open the roller door."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/29fb9b64-a3d4-46bd-885a-c7246c084e58.jpg", "cap": "2. Drive down the entry ramp and through the roller door."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/5c39b2c4-b132-4c18-9562-7aba9d576557.jpg", "cap": "3. Follow the arrows straight ahead through the car park."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/5b432e6c-b5ef-4ad2-ac31-e8c258f18390.jpg", "cap": "4. Go down the first ramp. At the bottom, turn LEFT at the yellow poles and go down the second ramp."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/d5a7dbcc-b099-45fa-9795-429810476450.jpg", "cap": "5. Turn LEFT again. Bay 8 is straight ahead. It&#x27;s a double-length bay, so park anywhere in it."}, {"img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/0de22062-d555-410b-8159-8a06c21c534e.jpg", "cap": "6. The lifts are behind you at the end of the car park. Go through the glass doors, tap your fob on the lift panel and press Level 2."}], "parkvideo": "", "keyextra": "<p>You get <b>3 keys<\/b>: the <b>black remote<\/b> opens the garage, the <b>fob<\/b> runs the lifts and building doors, and the <b>door key<\/b> opens Unit 8. Keep all 3 together.<\/p> <p><b>Heads up: the ground-level walk-in entrance is at the REAR of the building.<\/b><br>It is NOT next to the car park entry at 9 Irving Street. If you&#x27;re driving, park in the basement first, then take the lift up to Level 2.<\/p>", "keyTitle": "\ud83d\udd11 Key Collection Details", "parkTitle": "\ud83d\ude97 Driving to your car space", "name": "Fab in Phillip - 2bd 2bth Apt", "addr": "8/11 Irving Street, Phillip ACT 2606", "arrival": "https://www.citistayz.com/phi-oak", "keywhere": "<p>\ud83d\udccd <b>Key pick-up: lockbox at the tree by the parking meter outside 11 Irving Street, Phillip<\/b><br>Keys are ready from 3:00pm on arrival day, unless we&#x27;ve confirmed an early check-in.<\/p>", "manual": "<h4>\ud83c\udf73 Cooktop &amp; Oven<\/h4><p>Turn on the <b>wall switch<\/b> near the kitchen first. It powers <b>both the cooktop and the oven<\/b>.<\/p><h4>\ud83d\udecf Bedding &amp; Linen<\/h4><p>Fresh linen is supplied for the number of guests booked. There&#x27;s a <b>spare sheet set folded in the cupboard<\/b>.<\/p><p>Using the <b>sofa bed<\/b>? Its linen and bedding are in the <b>main bedroom wardrobe<\/b>.<\/p><p>Need <b>extra linen<\/b>? Just let us know. Additional charges may apply.<\/p><h4>\ud83d\udcfa Television<\/h4><p>The <b>Smart TV<\/b> is connected to the internet. Feel free to log in to your streaming apps, just remember to <b>log out before you leave<\/b>.<\/p><h4>\ud83d\udd14 Intercom<\/h4><ol><li><p>Ask them to <b>dial 11<\/b> on the intercom.<\/p><\/li><li><p>Answer the call inside the apartment.<\/p><\/li><li><p>Press <b>Talk<\/b>, then the <b>key/bell<\/b> button. This lets them into the lifts.<\/p><\/li><\/ol><h4>\ud83d\udd11 Lost keys &amp; lockouts<\/h4><ul><li><p><b>Lost keys:<\/b> $275 replacement fee (inc GST)<\/p><\/li><li><p><b>Lockout (keys left inside):<\/b> $165 call-out fee (inc GST)<\/p><\/li><\/ul><h4>\ud83e\uddf4 Supplies<\/h4><p>We provide a <b>starter supply<\/b> of essentials. Top-ups can be arranged and <b>may incur an extra charge<\/b>.<\/p>", "about": "<p>A stylish, modern 2 bedroom, 2 bathroom apartment in the Oaks Crown building in Phillip. It&#x27;s next to the Phillip Swimming and Ice Skating Centre, with Westfield Woden and Canberra Hospital close by. The building has a pool, gym and BBQ area.<\/p>", "faqs": "<p><b>Is the apartment cleaned during my stay?<\/b><br>Daily housekeeping isn&#x27;t included. You can book a mid-stay clean right here in your portal.<\/p><p><b>Is linen included?<\/b><br>Yes. Linen is supplied for the number of guests on your booking.<\/p><p><b>What supplies are included?<\/b><br>A starter pack of kitchen, bathroom and cleaning supplies. Top-ups come with a mid-stay clean, or you&#x27;re welcome to buy your own.<\/p><p><b>Can I get a tax invoice?<\/b><br>Yes. Email bookings@citistayz.com and we&#x27;ll send one.<\/p><p><b>Can I smoke?<\/b><br>No. The apartment and balcony are strictly non-smoking. A cleaning fee applies.<\/p><p><b>Quiet hours?<\/b><br>10:00pm to 8:00am. No parties or events.<\/p>", "safety": "<p><b>\ud83d\udea8 In Case of an Emergency<\/b><\/p><p>If there is an emergency, please <b>dial 000 immediately<\/b>. Once it is safe to do so, notify our team so we can assist if needed.<\/p><p>Please follow <b>all evacuation instructions<\/b> provided via the building&#x27;s speaker system.<\/p><p><b>\ud83d\udd14 Smoke Alarm<\/b><\/p><p>For your safety, the apartment is fitted with smoke alarms. Please <b>do not cover or tamper with the smoke alarm<\/b> under any circumstances.<\/p><p>When cooking:<\/p><p>Avoid opening the <b>hallway door<\/b>, as this may trigger the building&#x27;s smoke alarm system and result in fines for false alarms.<\/p><p>If additional ventilation is needed, please <b>open the balcony door instead<\/b>.<\/p><p><b>\ud83c\udfc3 Evacuation Procedure<\/b><\/p><p>In the event of an evacuation: Follow the instructions announced over the hallway speakers.<\/p><p>Refer to the <b>emergency evacuation map located near the elevators<\/b>, which shows all exits and the designated assembly area.<\/p><p><b>\ud83d\udeaa Fire Stairs<\/b><\/p><p>Fire stairs are located on <b>every level<\/b> of the building. Your apartment key can also be used to <b>access fire doors if required<\/b>.<\/p>", "bins": "<p>To the <b>left of the lifts<\/b>.<\/p>", "binsShort": "Where the bins are", "amen": "<p><b>\ud83d\uddd1\ufe0f Bins<\/b><br><p>To the <b>left of the lifts<\/b>.<\/p><\/p><p><b>\ud83c\udfca Swimming pool<\/b><br><p><b>Level 1<\/b>.<\/p><\/p><p><b>\ud83d\udcaa Gym<\/b><br><p><b>Ground floor<\/b>.<\/p><\/p><p><b>\ud83c\udf7d\ufe0f BBQ &amp; outdoor dining<\/b><br><p><b>Level 1<\/b>.<\/p><\/p>", "parking": "", "parkingShort": "Your car space and how to get there", "guideImg": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/1b9f6298-3b98-49fb-8a46-b42fbffbd1f2.png", "hero": ""}, "secret": {"wifiName": "TEST network", "wifiPass": "test-password", "lockbox": "00", "code": "0000"}, "offers": [{"id": "eci", "cat": "Arrival", "name": "Early check-in", "priceLabel": "From $33", "img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/c522582a-d19f-4941-b5c4-50509e22d447.jpg", "desc": "Skip the wait and settle in sooner. Pick your arrival time and we'll confirm once your apartment is ready. Your card is only charged if we approve.", "hl": ["Check in from 12pm", "Only charged if approved", "$33 per hour, up to 3 hours"], "optLabel": "Choose your arrival time", "opts": [{"t": "2:00 PM", "s": "1 hour early", "p": 3300}, {"t": "1:00 PM", "s": "2 hours early", "p": 6600}, {"t": "12:00 PM", "s": "3 hours early", "p": 9900}], "q": "Flight or arrival details (optional)"}, {"id": "keys", "cat": "Arrival", "name": "Extra set of keys", "priceLabel": "$38.50", "img": "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=900&q=80", "desc": "Every stay comes with 1 set of keys. Travelling with someone or on different schedules? Get a second set so you're never waiting on each other. Your card is only charged if we approve.", "hl": ["Only charged if approved"]}, {"id": "lco", "cat": "Departure", "name": "Late check-out", "priceLabel": "From $33", "img": "https://images.unsplash.com/photo-1639677322786-3c8154ebd750?auto=format&fit=crop&w=900&q=80", "desc": "Sleep in and pack at your own pace. Pick your departure time and we'll confirm. Your card is only charged if we approve.", "hl": ["Check out as late as 1pm", "Only charged if approved", "$33 per hour, up to 3 hours", "Price includes GST"], "optLabel": "Departure time", "opts": [{"t": "11:00 AM", "s": "1 hour later", "p": 3300}, {"t": "12:00 PM", "s": "2 hours later", "p": 6600}, {"t": "1:00 PM", "s": "3 hours later", "p": 9900}], "q": "Flight or departure details (optional)"}, {"id": "msc", "cat": "Housekeeping", "name": "Mid-stay cleaning", "priceLabel": "From $88", "img": "https://images.unsplash.com/photo-1760722974657-f64bce2f9cc5?auto=format&fit=crop&w=900&q=80", "desc": "Staying a while? Come home to a fresh, clean apartment partway through your stay. Pick your apartment size and preferred day, and we'll confirm.", "hl": ["Perfect for stays of 1 week or more", "Only charged if approved", "Prices include GST", "Fresh linen and towels included"], "optLabel": "Property size", "opts": [{"t": "1 Bed 1 Bath", "p": 8800}, {"t": "2 Bed 1 Bath", "p": 11000}, {"t": "2 Bed 2 Bath", "p": 13200}, {"t": "3 Bed 2 Bath", "p": 16500}], "q": "Anything we should know? (Optional)"}, {"id": "lin", "cat": "Housekeeping", "name": "Extra sofa bed linen", "priceLabel": "$27.50", "img": "https://images.unsplash.com/photo-1643913590859-c81793b54649?auto=format&fit=crop&w=900&q=80", "desc": "Prefer to sleep separately? We'll supply an extra set of linen for the sofa bed: a flat sheet, doona and 2 pillows. Already paid for an extra guest? Linen is included, no need to add this.", "hl": ["Only charged if approved"]}, {"id": "ext", "cat": "Extra nights", "name": "Extend my stay", "priceLabel": "Save 5%", "img": "https://images.unsplash.com/photo-1497032628192-86f99bcd76bc?auto=format&fit=crop&w=900&q=80", "desc": "Stay longer, save 5%. Pick your new check-out date and we'll confirm availability. Your card is only charged once approved.", "hl": ["5% off your nightly rate", "No need to pack up and move", "Subject to availability"], "q": "What date would you like to check out instead?"}, {"id": "early", "cat": "Extra nights", "name": "Arrive a day early", "priceLabel": "Save 5%", "img": "https://citistayz-canberra.github.io/citistayz-guides/assets/conduit/e1435a61-2f9a-4a7e-8938-a0edd758f766.webp", "desc": "Want to settle in sooner? Add nights before your check-in and save 5%. Pick your new arrival date and we'll confirm availability.", "hl": ["5% off your nigh     <label class="check"><input type="checkbox" id="f8"> Keep me updated. Send me Citi Stayz offers and direct booking deals. Unsubscribe anytime.</label>
    <div class="err" id="ferr"></div><button class="btn" id="fgo">Continue</button></div>${testPanel()}`;
    $("#fgo").onclick=()=>{const v=k=>$("#"+k).value.trim();if(!v("f1")||!v("f2")||!v("f3")||!v("f4")){$("#ferr").textContent="Please fill in your name, mobile, email and arrival time.";return;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v("f3"))){$("#ferr").textContent="Please check your email address.";return;}
      S.detailsDone=true;S.step=2;if(!needAgree())toast("You're all set. Your guide is unlocked");render();scrollTo(0,0);};
  }else{
    $("#app").innerHTML=head+`<h3 style="margin-top:4px">Citi Stayz Guest Agreement</h3><div class="agree">${D.agreement}</div>
    <label>Sign here</label><canvas id="sig"></canvas><button class="chip" id="sigclr" style="margin-top:8px">Clear</button>
    <label class="check"><input type="checkbox" id="agr"> I have read and agree to this agreement, the House Rules and the Terms and Conditions.</label>
    <div class="err" id="aerr"></div><button class="btn" id="ago">Sign and unlock my guide</button></div>${testPanel()}`;
    const c=$("#sig"),x=c.getContext("2d");let draw=false,inked=false;const fit=()=>{const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;x.scale(2,2);x.lineWidth=2.2;x.lineCap="round";};fit();
    const pt=e=>{const r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top];};
    const start=e=>{e.preventDefault();draw=true;const[a,b2]=pt(e);x.beginPath();x.moveTo(a,b2);};
    const move=e=>{if(!draw)return;e.preventDefault();const[a,b2]=pt(e);x.lineTo(a,b2);x.stroke();inked=true;};
    const end=()=>{draw=false;};
    if(window.PointerEvent){c.addEventListener("pointerdown",start);c.addEventListener("pointermove",move);c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);c.addEventListener("pointerleave",end);}
    else{c.addEventListener("touchstart",start,{passive:false});c.addEventListener("touchmove",move,{passive:false});c.addEventListener("touchend",end);c.addEventListener("mousedown",start);c.addEventListener("mousemove",move);addEventListener("mouseup",end);}
    $("#sigclr").onclick=()=>{x.clearRect(0,0,c.width,c.height);inked=false;};
    $("#ago").onclick=()=>{if(!inked){$("#aerr").textContent="Please sign in the box.";return;}if(!$("#agr").checked){$("#aerr").textContent="Please tick to agree.";return;}S.agreeDone=true;toast("You're all set. Your guide is unlocked");render();scrollTo(0,0);};
  }
  wireTest();
}
function testPanel(){return `<div class="test"><b>🧪 Test controls (only in this test version)</b>
  <div class="chips">${[["before","Before check-in"],["during","After 3pm check-in"],["after","After checkout"]].map(([k,l])=>`<button class="chip ${S.phase===k?"on":""}" data-ph="${k}">${l}</button>`).join("")}</div>
  <div class="chips">${["Booking.com","Airbnb","CTM"].map(k=>`<button class="chip ${S.channel===k?"on":""}" data-chn="${k}">${k}</button>`).join("")}</div>
  <button class="chip" data-reset="1">↺ Restart as a new guest</button></div>`;}
function wireTest(){document.querySelectorAll("[data-ph]").forEach(x=>x.onclick=()=>{S.phase=x.dataset.ph;render();});
  document.querySelectorAll("[data-chn]").forEach(x=>x.onclick=()=>{S.channel=x.dataset.chn;render();});
  document.querySelectorAll("[data-reset]").forEach(x=>x.onclick=()=>{Object.assign(S,{cover:true,detailsDone:false,agreeDone:false,step:1,req:{},phase:"before",tab:"stay"});render();scrollTo(0,0);});}
render();
</script></body></html>
